<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' plumd-plugin:; style-src 'self' 'unsafe-inline' plumd-plugin:; img-src 'self' data: blob: file: https: plumd-plugin:; font-src 'self' data: plumd-plugin:; connect-src 'self' plumd-plugin:;" />
  <title>PluMd</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="early.js"></script>
</head>
<body>
  <header id="titlebar">
    <div class="qa">
      <img class="brand" src="logo.svg" alt="PluMd" title="PluMd" />
      <button type="button" class="rb rb-ic" data-cmd="toggle-sidebar" data-state="sidebar" data-icon="sidebar" title="Panel de carpetas (Ctrl+Mayús+E)"></button>
      <button type="button" class="rb rb-ic" data-cmd="save" data-icon="save" title="Guardar (Ctrl+S)"></button>
      <button type="button" class="rb rb-ic" data-cmd="undo" data-icon="undo" title="Deshacer (Ctrl+Z)"></button>
      <button type="button" class="rb rb-ic" data-cmd="redo" data-icon="redo" title="Rehacer (Ctrl+Y)"></button>
    </div>
    <div class="doc-title"><span id="filename">Documento sin título</span><span id="dirty" hidden>●</span></div>
    <div class="tb-right"></div>
  </header>
  <nav id="tabs">
    <button type="button" class="tab file" data-cmd="file-menu">Archivo</button>
    <button type="button" class="tab active" data-tab="home">Inicio</button>
    <button type="button" class="tab" data-tab="insert">Insertar</button>
    <button type="button" class="tab" data-tab="view">Vista</button>
    <button type="button" class="tab" data-tab="help">Ayuda</button>
    <span class="spacer"></span>
    <button type="button" id="btn-collapse" class="rb rb-ic" data-cmd="ribbon-toggle" data-icon="chevronup" title="Contraer la cinta"></button>
  </nav>
  <div id="panels"></div>
  <div id="workspace">
    <aside id="sidebar" hidden aria-label="Panel lateral">
      <div id="sb-tabs" hidden></div>
      <div id="sb-files">
        <div class="sb-head">
          <span id="sb-title" class="sb-title">Carpeta</span>
          <button type="button" id="sb-new" class="rb rb-ic" data-icon="filenew" title="Nuevo documento"></button>
          <button type="button" id="sb-open" class="rb rb-ic" data-icon="folder" title="Abrir otra carpeta (Ctrl+Mayús+O)"></button>
          <button type="button" id="sb-refresh" class="rb rb-ic" data-icon="refresh" title="Actualizar"></button>
          <button type="button" id="sb-close" class="rb rb-ic" data-icon="close" title="Cerrar el panel (se vuelve a abrir desde Vista > Panel de carpetas)"></button>
        </div>
        <input id="sb-filter" type="search" placeholder="Filtrar por nombre o escribir una ruta + Intro…" autocomplete="off" />
        <div id="sb-note" class="sb-note" hidden></div>
        <div id="sb-tree" role="tree" hidden></div>
        <div id="sb-empty" class="sb-empty">
          <p class="sb-empty-text"></p>
          <button type="button" id="sb-empty-open" class="primary">Abrir carpeta…</button>
        </div>
      </div>
      <div id="sb-panels"></div>
    </aside>
    <div id="splitter" hidden title="Arrastra para cambiar el ancho"></div>
    <div id="docarea">
      <div id="doctabs" role="tablist" aria-label="Documentos abiertos"></div>
      <div id="banner" hidden></div>
      <main>
        <div id="editor"></div>
        <div id="draw" hidden></div>
        <div id="no-docs" hidden>
          <p>No hay documentos abiertos.</p>
          <div>
            <button type="button" id="nd-new" class="primary">Nuevo documento (Ctrl+N)</button>
            <button type="button" id="nd-draw">Nuevo dibujo</button>
            <button type="button" id="nd-open">Abrir fichero… (Ctrl+O)</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="float-note" role="status" aria-live="polite"></div>
  <button type="button" id="focus-exit" class="rb rb-ic" data-icon="close" title="Salir de pantalla completa (F11)"></button>
  <footer id="statusbar">
    <span id="wordcount">0 palabras</span>
    <span id="status-plugins" class="status-plugins"></span>
    <span class="spacer"></span>
    <span class="views">
      <button type="button" class="rb rb-ic" data-cmd="mode-read" data-state="mode-read" data-icon="eye" title="Lectura"></button>
      <button type="button" class="rb rb-ic" data-cmd="mode-source" data-state="mode-source" data-icon="filecode" title="Código"></button>
    </span>
    <span class="zoom">
      <button type="button" class="rb rb-ic" data-cmd="zoom-out" data-icon="zoomout" title="Alejar"></button>
      <input id="zoom" type="range" min="50" max="250" step="10" value="100" title="Zoom" />
      <button type="button" class="rb rb-ic" data-cmd="zoom-in" data-icon="zoomin" title="Acercar"></button>
      <span id="zoomval">100%</span>
    </span>
  </footer>
  <div id="dropzone" hidden><div>Suelta el fichero .md para abrirlo en una pestaña</div></div>
  <div id="dlg" hidden></div>
  <script src="renderer.js"></script>
</body>
</html>
